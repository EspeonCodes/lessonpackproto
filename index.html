<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Document</title>
 <link rel="stylesheet" href="./canvas.css">
</head>
<body>
 <header class="title">Working Prototype</header>
 <main>
  <div class="gamebox">
   <img id='ball' src="./8-Ball-Pool-PNG-Photos-2401399322.png" alt="8-bal">
  </div>
  <div class="sidebar">
   <button class="play">PLAY</button>
   <button class="stop">STOP</button>

   <div class="slider">
    <div class="sliderTitle">MANAGE HEIGHT</div>
    <div class="sliderInterface">
     <button class="control reduceHeight">-</button>
     <div class="display displayHeight">X</div>
     <button class="control increaseHeight">+</button>
    </div>
   </div>

   <div class="slider">
    <div class="sliderTitle">MANAGE VELOCITY</div>
    <div class="sliderInterface">
     <button class="control reduceVelocity">-</button>
     <div class="display displayVelocity">X</div>
     <button class="control increaseVelocity">+</button>
    </div>
   </div>
   
  </div>
 </main>
 <footer>by Espeon, 2026</footer>

 <script src="./canvasScript.js"></script>
</body>
</html>
